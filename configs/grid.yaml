data:
  bucket: raw
  key: taxi_trip_pricing.csv
  local_path: data/processed/taxi_trip_pricing.csv
  target: Trip_Price

experiment:
  name: taxi-pricing-grid
  tracking_uri: http://mlflow:5000
  s3_bucket: experiments
  test_size: 0.2
  random_state: 42

model:
  grid:
    n_estimators: [150, 300]
    max_depth: [8, 12, null]
    max_features: ["sqrt", "log2", null]

